<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Standing</title>
</head>
<body>
    <h1>Tournament Standing</h1>

    <table>
        <thead>
            <tr><th>Place</th><th>Team</th><th>Games</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>Points</th></tr>
        </thead>
        <tbody id = "standingTable"></tbody>
    </table>

    <script>
        const standingTable = document.getElementById("standingTable");

        const standing = [
        { name: "Enjabs",  games: 10, w: 8, d: 2, l: 0, gf: 25, ga: 10, points: 24 },
        { name: "WK", games: 10, w: 8, d: 2, l: 0, gf: 25, ga: 10, points: 24 },
        { name: "Usuthu", games: 10, w: 8, d: 2, l: 0, gf: 25, ga: 10, points: 24 },
        { name: "Lusundvu", games: 10, w: 8, d: 2, l: 0, gf: 25, ga: 10, points: 24 }
        ];

        let rows = "";
        standing.forEach((team, index) => {
            rows += `<tr><td>${index + 1}</td><td>${team.name}</td><td>${team.games}</td><td>${team.w}</td><td>${team.d}</td><td>${team.l}</td><td>${team.gf}</td><td>${team.ga}</td><td>${team.points}</td></tr>`;
        });
        standingTable.innerHTML = rows;



        console.log(rows);
    </script>
</body>
</html>
