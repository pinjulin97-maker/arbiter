<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Standing</title>
</head>
<body>
    <h1>Tournament Standing</h1>

    <div class="add-match">
        <select id="homeSelect"></select>
        <input type="number" id="homeGoals" min="0" value="0">
        <span>vs</span>
        <input type="number" id="awayGoals" min="0" value="0">
        <select id="awaySelect"></select>
        <button id="addMatch">Add match</button>
    </div>

    <div class="add-team">
        <input type="text" id="teamName" placeholder="Team Name">
        <button id="addTeam">Add Team</button>
    </div>
    
    <table>
        <thead>
            <tr><th>Place</th><th>Team</th><th>Games</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Points</th></tr>
        </thead>
        <tbody id = "standingTable"></tbody>
    </table>

    <div class="clear">
        <button id="clearMatches">Clear Matches</button>
        <button id="clearTeams">Clear Teams</button>
        <button id="reset">Reset</button>
    </div>

    <script>
        function games(team) {return team.w + team.d + team.l;}
        function points(team) {return (team.w * 3) + team.d;}
        function goalDifference(team) {return team.gf - team.ga;}
        function saveMatches() {localStorage.setItem("matches", JSON.stringify(matches));}
        function loadMatches() {return JSON.parse(localStorage.getItem("matches")) || [];}
        function saveTeams() {localStorage.setItem("teams", JSON.stringify(teams));}
        function loadTeams() {return JSON.parse(localStorage.getItem("teams")) || ["Enjabs", "WK", "Usuthu", "Lusundvu"];}

        let teams = loadTeams();
        let matches = loadMatches();

        const standingTable = document.getElementById("standingTable");

        const homeSelect = document.getElementById("homeSelect");
        const awaySelect = document.getElementById("awaySelect");

        function fillDropdowns() {
            homeSelect.innerHTML = "";
            awaySelect.innerHTML = "";
            teams.forEach(team => {
                homeSelect.innerHTML += `<option value="${team}">${team}</option>`;
                awaySelect.innerHTML += `<option value="${team}">${team}</option>`;
            });
        }

        fillDropdowns();
        render();

        const clearMatches = document.getElementById("clearMatches");
        clearMatches.addEventListener("click", () => {
            matches = [];
            saveMatches();
            render();
        });

        const clearTeams = document.getElementById("clearTeams");
        clearTeams.addEventListener("click", () => {
            teams = [];
            matches = [];
            saveTeams();
            saveMatches();
            fillDropdowns();
            render();
        });

        const reset = document.getElementById("reset");
        reset.addEventListener("click", () => {
            teams = [];
            matches = [];
            saveTeams();
            saveMatches();
            fillDropdowns();
            render();
        });

        const addTeam = document.getElementById("addTeam");
        addTeam.addEventListener("click", () => {
            const teamName = document.getElementById("teamName").value.trim();
            if (teamName && !teams.includes(teamName)) {
                teams.push(teamName);
                fillDropdowns();
                document.getElementById("teamName").value = "";
            } else {
                alert("Please enter a valid and unique team name.");
            }
            render()
            saveTeams();
        });

        const addMatch = document.getElementById("addMatch");
        addMatch.addEventListener("click", () => {
            const homeTeam = homeSelect.value;
            const awayTeam = awaySelect.value;
            const homeGoals = parseInt(document.getElementById("homeGoals").value);
            const awayGoals = parseInt(document.getElementById("awayGoals").value);

            if (isNaN(homeGoals) || isNaN(awayGoals) || homeGoals < 0 || awayGoals < 0) {
                alert("Please enter valid non-negative goal numbers.");
                return;
            }

            if (homeTeam === awayTeam) {
                alert("Home and Away teams must be different.");
                return;
            }

            matches.push({home: homeTeam, away: awayTeam, homeGoals, awayGoals});

            saveMatches();
            render();
        });

        function render() {

            const table = {};
            teams.forEach(team => {
                table[team] = {name: team, w: 0, d: 0, l: 0, gf: 0, ga: 0 };
            });

            matches.forEach(match => {
                const home = table[match.home];
                const away = table[match.away];

                home.gf += match.homeGoals;
                home.ga += match.awayGoals;
                away.gf += match.awayGoals;
                away.ga += match.homeGoals;

                if (match.homeGoals > match.awayGoals) {
                    home.w++;
                    away.l++;
                } else if (match.homeGoals < match.awayGoals) {
                    home.l++;
                    away.w++;
                } else {
                    home.d++;
                    away.d++;
                }
            });

            const standing = Object.values(table);

            let rows = "";

            standing.sort((a, b) => 
                points(b) - points(a)
                || goalDifference(b) - goalDifference(a)
                || b.gf - a.gf
            );

            standing.forEach((team, index) => {
                rows += `<tr><td>${index + 1}</td><td>${team.name}</td><td>${games(team)}</td><td>${team.w}</td><td>${team.d}</td><td>${team.l}</td><td>${team.gf}</td><td>${team.ga}</td><td>${goalDifference(team)}</td><td>${points(team)}</td></tr>`;
            });

            standingTable.innerHTML = rows;

        }
        
    </script>
</body>
</html>
